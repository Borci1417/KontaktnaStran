<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#11181d">
  <meta name="robots" content="noindex, nofollow">
  <title>Boris Potočnik · Contact</title>
  <meta name="description" content="Contact Boris Potočnik by phone or email, or open his website and LinkedIn profile.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%2311181d'/%3E%3Ccircle cx='32' cy='32' r='27' fill='none' stroke='%23d6dfe5' stroke-width='1.5'/%3E%3Ctext x='11' y='45' fill='%23d6dfe5' font-family='Georgia,serif' font-size='34'%3EB%3C/text%3E%3Ctext x='28' y='35' fill='%23d6dfe5' font-family='Georgia,serif' font-size='34'%3EP%3C/text%3E%3C/svg%3E">
  <style>
    :root { color-scheme: dark; --bg:#11181d; --fg:#e5eaed; --muted:#a5afb7; --silver:#d6dfe5; --border:#35424c; }
    * { box-sizing:border-box; }
    html { font-size:16px; }
    body { margin:0; min-height:100vh; min-height:100dvh; background:var(--bg); color:var(--fg); font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    main { width:min(100%,29rem); margin:0 auto; padding:2rem 1.25rem 2.5rem; }
    header { text-align:center; margin-bottom:1.75rem; }
    .brand { display:block; width:5.5rem; height:5.5rem; margin:0 auto 1rem; }
    h1 { margin:0; font-size:1.8rem; font-weight:650; letter-spacing:.025em; line-height:1.2; }
    .role { margin:.7rem 0 0; color:var(--muted); font-size:.875rem; letter-spacing:.15em; text-transform:uppercase; line-height:1.6; }
    .contacts { display:grid; gap:.75rem; }
    a { -webkit-tap-highlight-color:transparent; }
    .contact { display:grid; grid-template-columns:1.5rem minmax(0,1fr); gap:1rem; align-items:center; min-height:5rem; padding:1rem 1.1rem; color:var(--fg); background:#182229; border:1px solid var(--border); border-radius:.8rem; text-decoration:none; transition:background .15s,border-color .15s; }
    .contact:hover { background:#202d36; border-color:#7c8d99; }
    .contact:active { background:#293a46; }
    a:focus-visible { outline:3px solid var(--silver); outline-offset:4px; }
    .contact svg,.save svg { display:block; width:1.5rem; height:1.5rem; color:var(--silver); flex:none; }
    .label { display:block; font-size:1rem; font-weight:600; line-height:1.35; }
    .value { display:block; margin-top:.35rem; font-size:.875rem; color:var(--muted); line-height:1.5; overflow-wrap:anywhere; }
    .save { display:flex; align-items:center; justify-content:center; gap:.75rem; margin-top:1.25rem; min-height:3.5rem; padding:.85rem 1rem; background:var(--silver); border:1px solid var(--silver); border-radius:.8rem; color:var(--bg); font-size:1rem; font-weight:650; line-height:1.4; text-decoration:none; }
    .save svg { color:var(--bg); }
    .save:hover { background:#eef2f5; }
    @media (min-width:700px) { body { display:flex; align-items:center; } main { padding-top:2.5rem; padding-bottom:2.5rem; } }
    @media (prefers-reduced-motion:reduce) { .contact { transition:none; } }
  </style>
</head>
<body>
  <main>

      <h1>Boris Potočnik</h1>
      <p class="role">Full Stack Developer</p>
    </header>
    <nav class="contacts" aria-label="Contact Boris Potočnik">
      <a class="contact" href="tel:+38664149366">

        <span><span class="label">Phone</span><span class="value">+386 64 149 366</span></span>
      </a>
      <a class="contact" href="mailto:boris5.potocnik@gmail.com">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m3 6 9 7 9-7"/></svg>
        <span><span class="label">Email</span><span class="value">boris5.potocnik@gmail.com</span></span>
      </a>
      <a class="contact" href="https://boris-potocnik-predstavitvena.vercel.app/en" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18"/></svg>
        <span><span class="label">Website</span><span class="value">boris-potocnik-predstavitvena.vercel.app/en</span></span>
      </a>
      <a class="contact" href="https://www.linkedin.com/in/boris-potocnik-0b145b2b0/" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M7.5 10.5v7M11 17.5v-7M11 13c1-3.5 5.5-3.5 5.5 0v4.5"/><circle cx="7.5" cy="7.5" r=".75" fill="currentColor" stroke="none"/></svg>

    </nav>

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M4 16v5h16v-5"/></svg>
      Save contact
    </a>
  </main>
</body>
</html>
